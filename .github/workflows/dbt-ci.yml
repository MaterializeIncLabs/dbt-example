name: dbt CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'models/**'
      - 'macros/**'
      - 'tests/**'
      - 'seeds/**'
      - 'dbt_project.yml'
      - 'packages.yml'
      - 'selectors.yml'
      - '.github/workflows/dbt-ci.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dbt Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dbt
        uses: ./.github/actions/setup-dbt
        with:
          python-version: '3.11'

      - name: Parse dbt project
        run: |
          echo "::group::Parsing dbt project"
          dbt parse --profiles-dir . --profile materialize_auction_house --target dev
          echo "::endgroup::"
          echo "✓ dbt project parsed successfully"
          echo "✓ All refs and sources are valid"
          echo "✓ SQL syntax validated"

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: target/manifest.json
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "### ✅ dbt CI Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Project parsing successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ All refs and sources validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ SQL syntax validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Model dependencies resolved" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This workflow validates project structure and SQL syntax." >> $GITHUB_STEP_SUMMARY
          echo "Full integration tests with data run on the QA environment after merge." >> $GITHUB_STEP_SUMMARY

      - name: Failure summary
        if: failure()
        run: |
          echo "### ❌ dbt CI Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common issues:**" >> $GITHUB_STEP_SUMMARY
          echo "- Invalid SQL syntax" >> $GITHUB_STEP_SUMMARY
          echo "- Missing or invalid ref() or source() references" >> $GITHUB_STEP_SUMMARY
          echo "- Missing dependencies in packages.yml" >> $GITHUB_STEP_SUMMARY
          echo "- Circular dependencies between models" >> $GITHUB_STEP_SUMMARY
