name: 'materialize_auction_house'
version: '1.0.0'
config-version: 2

profile: 'materialize_auction_house'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  materialize_auction_house:
    staging:
      +materialized: view
      +schema: staging
      +cluster: "{{ target.cluster }}"
    intermediate:
      +materialized: view
      +schema: intermediate
      +cluster: "{{ target.cluster }}"
    marts:
      +schema: marts
      +cluster: "{{ target.cluster }}"

vars:
  flipper_threshold_days: 8
  min_profit_margin: 0.20
  sink_cluster: sinks

  # Cluster names are defined in profiles.yml per target
  # This allows flexible configuration based on environment
  # Example: dev uses 'sources', qa uses 'qa_sources', production uses 'production_sources'

  # Blue/Green Deployment Configuration
  # Used by dbt-materialize deploy_init, deploy_promote macros
  # NOTE: Sources and sinks are excluded - they remain in separate clusters
  deployment:
    dev:
      clusters:
        - quickstart
        - compute
      schemas:
        - public_staging
        - public_intermediate
        - public_marts
    production:
      clusters:
        - production_compute
      schemas:
        - production_staging
        - production_intermediate
        - production_marts